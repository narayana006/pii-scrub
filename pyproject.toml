[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-scrub"
version = "0.1.0"
description = "Redact PII and secrets before text reaches an LLM, then restore them in the response."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
keywords = ["pii", "redaction", "llm", "privacy", "secrets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pii-scrub = "pii_scrub.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/pii-scrub"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
